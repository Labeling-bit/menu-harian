<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Hari Ini</title>

<style>
*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f7f0e5;
  color:#15243b;
  font-family:Georgia,serif;
  overflow-x:hidden;
}

.container{
  max-width:900px;
  margin:auto;
  padding:14px;
}

.hero,.section{
  background:#fff;
  border-radius:24px;
  padding:24px;
  margin:14px 0;
  box-shadow:0 7px 24px rgba(0,0,0,.07);
}

.hero{
  text-align:center;
  background:linear-gradient(135deg,#fffaf0,#f9dfad);
  animation:heroEnter 1s cubic-bezier(.22,1,.36,1) both;
}

.brand{
  font-size:22px;
  font-weight:bold;
  margin-bottom:8px;
}

.title{
  font-size:64px;
  line-height:1;
  font-weight:900;
  margin:8px 0;
}

.subtitle{
  font-size:40px;
  color:#a34c1d;
  font-style:italic;
  margin:8px 0;
}

.date{
  font-size:25px;
  font-weight:bold;
  margin:10px 0;
}

.badge{
  display:block;
  background:#15243b;
  color:#fff;
  border-radius:99px;
  padding:14px 18px;
  margin:14px auto 0;
  font-size:19px;
  max-width:680px;
}

h2{
  margin:0 0 18px;
  font-size:30px;
}

.menu-list{
  margin:0;
  padding-left:28px;
}

.menu-list li{
  font-size:21px;
  line-height:1.6;
  margin:7px 0;
}

.photo{
  width:100%;
  max-height:600px;
  object-fit:contain;
  border-radius:16px;
  background:#eee;
  display:block;
}

.card-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.small-card{
  border:2px solid #efb43f;
  border-radius:18px;
  padding:18px;
  background:#fffaf0;
}

.small-card h3{
  margin:0 0 12px;
  font-size:23px;
}

.price{
  font-weight:800;
  font-size:19px;
  margin-bottom:10px;
}

.items{
  margin:0;
  padding-left:22px;
}

.items li{
  font-size:18px;
  line-height:1.55;
  margin:5px 0;
}

.nutrition-card{
  border:2px solid #efb43f;
  border-radius:18px;
  padding:18px;
  background:#fffaf0;
  margin-bottom:14px;
}

.nutrition-card h3{
  margin:0 0 12px;
  font-size:23px;
}

.total{
  margin:0 0 14px;
  font-size:17px;
}

.nut-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:10px 0;
  border-bottom:1px solid #e5d9c5;
  font-size:19px;
}

.nut-row:last-child{border-bottom:0}

.expiry{
  background:#fff1c9;
  border-left:7px solid #f59e0b;
  border-radius:14px;
  padding:18px;
  font-size:20px;
  line-height:1.6;
}

.empty{
  text-align:center;
  color:#667085;
  font-size:20px;
  padding:20px 5px;
}

footer{
  text-align:center;
  padding:25px 10px;
  color:#667085;
  font-size:14px;
}

/* =========================
   ANIMASI SCROLL
   ========================= */

/* Semua section akan muncul lagi setiap kali masuk layar */
.scroll-animate{
  opacity:0;
  transform:translateY(85px) scale(.96);
  filter:blur(3px);
  transition:
    opacity .8s cubic-bezier(.22,1,.36,1),
    transform .8s cubic-bezier(.22,1,.36,1),
    filter .8s ease;
  will-change:opacity,transform,filter;
}

.scroll-animate.show{
  opacity:1;
  transform:translateY(0) scale(1);
  filter:blur(0);
}

/* Efek foto: zoom + sedikit naik */
.photo-section-animate .photo{
  opacity:0;
  transform:scale(.88) translateY(25px);
  transition:
    opacity .9s ease,
    transform 1s cubic-bezier(.22,1,.36,1);
  will-change:opacity,transform;
}

.photo-section-animate.show .photo{
  opacity:1;
  transform:scale(1) translateY(0);
}

/* Efek judul section */
.scroll-animate h2{
  opacity:0;
  transform:translateX(-25px);
  transition:
    opacity .7s ease .08s,
    transform .7s cubic-bezier(.22,1,.36,1) .08s;
}

.scroll-animate.show h2{
  opacity:1;
  transform:translateX(0);
}

/* Kartu-kartu muncul bergantian */
.stagger-card{
  opacity:0;
  transform:translateY(35px) scale(.96);
  transition:
    opacity .65s cubic-bezier(.22,1,.36,1),
    transform .65s cubic-bezier(.22,1,.36,1);
  will-change:opacity,transform;
}

.stagger-card.show{
  opacity:1;
  transform:translateY(0) scale(1);
}

/* Item menu muncul satu per satu */
.menu-list li{
  opacity:0;
  transform:translateX(-18px);
  transition:
    opacity .55s ease,
    transform .55s cubic-bezier(.22,1,.36,1);
}

.scroll-animate.show .menu-list li{
  opacity:1;
  transform:translateX(0);
}

.scroll-animate.show .menu-list li:nth-child(1){transition-delay:.08s}
.scroll-animate.show .menu-list li:nth-child(2){transition-delay:.16s}
.scroll-animate.show .menu-list li:nth-child(3){transition-delay:.24s}
.scroll-animate.show .menu-list li:nth-child(4){transition-delay:.32s}
.scroll-animate.show .menu-list li:nth-child(5){transition-delay:.40s}
.scroll-animate.show .menu-list li:nth-child(6){transition-delay:.48s}

/* Animasi hero saat halaman pertama dibuka */
@keyframes heroEnter{
  from{
    opacity:0;
    transform:translateY(-25px) scale(.97);
    filter:blur(4px);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

/* Aksesibilitas */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

  .hero,
  .scroll-animate,
  .stagger-card,
  .photo-section-animate .photo,
  .scroll-animate h2,
  .menu-list li{
    opacity:1;
    transform:none;
    filter:none;
    transition:none;
    animation:none;
  }
}

/* Tampilan HP */
@media(max-width:650px){
  .container{padding:10px}
  .hero,.section{padding:20px}
  .title{font-size:50px}
  .subtitle{font-size:32px}
  .date{font-size:22px}
  .badge{font-size:17px}
  h2{font-size:28px}
  .card-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main class="container">

<section class="hero">
  <div class="brand">SPPG Lamongan Sugio German 2</div>
  <div class="title">MENU</div>
  <div class="subtitle">Special Today's</div>
  <div class="date" id="dateText"></div>
  <div class="badge">MENU HARI INI • INFORMASI GIZI</div>
</section>

<section class="section scroll-animate photo-section-animate" id="photoSection" style="display:none">
  <h2>📷 Foto Menu</h2>
  <img id="photo" class="photo" alt="Foto menu">
</section>

<section class="section scroll-animate">
  <h2>🍽️ Menu</h2>
  <ul class="menu-list" id="menuList"></ul>
</section>

<section class="section scroll-animate" id="portionSection" style="display:none">
  <h2>🥗 Pilihan Porsi</h2>
  <div class="card-grid" id="portionCards"></div>
</section>

<section class="section scroll-animate">
  <h2>❤️ Informasi Gizi</h2>
  <div id="nutritionCards"></div>
</section>

<section class="section scroll-animate">
  <h2>⏰ Batas Konsumsi</h2>
  <div class="expiry" id="expiry"></div>
</section>

<footer class="scroll-animate">
  Informasi menu dan gizi • Data ditampilkan hanya untuk menu terbaru.
</footer>

</main>

<script src="data.js"></script>
<script>
const monthNames=[
  "Januari","Februari","Maret","April","Mei","Juni",
  "Juli","Agustus","September","Oktober","November","Desember"
];

function formatDate(s){
  const d=new Date(s+"T00:00:00");
  return d.getDate()+" "+monthNames[d.getMonth()]+" "+d.getFullYear();
}

function getLatestDate(){
  const keys=Object.keys(menuData||{})
    .filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k))
    .sort();
  return keys.length ? keys[keys.length-1] : null;
}

function render(){
  const dateString=getLatestDate();
  const dateText=document.getElementById("dateText");

  if(!dateString){
    dateText.textContent="";
    document.getElementById("menuList").innerHTML =
      "<li>Belum ada data menu.</li>";
    document.getElementById("nutritionCards").innerHTML =
      '<div class="empty">Belum ada informasi gizi.</div>';
    document.getElementById("expiry").textContent="Belum ada menu.";
    return;
  }

  const data=menuData[dateString];
  dateText.textContent=formatDate(dateString);

  if(data.photo){
    document.getElementById("photo").src=data.photo;
    document.getElementById("photoSection").style.display="block";
  }

  const menu=Array.isArray(data.menu)?data.menu:[];
  document.getElementById("menuList").innerHTML=menu.length
    ? menu.map(item=>"<li>"+item+"</li>").join("")
    : "<li>Menu belum tersedia.</li>";

  const portions=Array.isArray(data.portions)?data.portions:[];
  if(portions.length){
    document.getElementById("portionSection").style.display="block";
    document.getElementById("portionCards").innerHTML=portions.map((p,index)=>`
      <div class="small-card stagger-card" style="transition-delay:${index*100}ms">
        <h3>${p.nama||"Porsi"}</h3>
        ${p.harga?`<div class="price">${p.harga}</div>`:""}
        ${Array.isArray(p.items)?`<ul class="items">${p.items.map(i=>`<li>${i}</li>`).join("")}</ul>`:""}
      </div>
    `).join("");
  }

  const nutrition=Array.isArray(data.nutrition)?data.nutrition:[];
  if(!nutrition.length){
    document.getElementById("nutritionCards").innerHTML =
      '<div class="empty">Belum ada informasi gizi.</div>';
  }else{
    document.getElementById("nutritionCards").innerHTML=nutrition.map((n,index)=>`
      <div class="nutrition-card stagger-card" style="transition-delay:${index*100}ms">
        <h3>${n.nama||"Informasi Gizi"}</h3>
        ${n.total_porsi?`<p class="total"><strong>Total porsi:</strong> ${n.total_porsi}</p>`:""}
        <div class="nut-row"><span>Energi</span><strong>${n.energi||"-"}</strong></div>
        <div class="nut-row"><span>Protein</span><strong>${n.protein||"-"}</strong></div>
        <div class="nut-row"><span>Lemak</span><strong>${n.lemak||"-"}</strong></div>
        <div class="nut-row"><span>Karbohidrat</span><strong>${n.karbohidrat||"-"}</strong></div>
        <div class="nut-row"><span>Serat</span><strong>${n.serat||"-"}</strong></div>
      </div>
    `).join("");
  }

  document.getElementById("expiry").innerHTML =
    data.batas_konsumsi
      ? "<strong>Batas konsumsi:</strong> "+data.batas_konsumsi
      : "Belum ada informasi batas konsumsi.";
}

function startScrollAnimations(){

  const getTargets = () =>
    document.querySelectorAll(".scroll-animate, .stagger-card");

  if(!("IntersectionObserver" in window)){
    getTargets().forEach(el=>el.classList.add("show"));
    return;
  }

  let lastScrollY = window.scrollY;
  let direction = "down";
  let directionTimer = null;

  function animateVisibleElements(){
    const targets = getTargets();

    targets.forEach(el => {
      const rect = el.getBoundingClientRect();
      const visible =
        rect.bottom > 0 &&
        rect.top < window.innerHeight;

      if(visible){
        // Reset lalu jalankan ulang agar animasi benar-benar replay
        el.classList.remove("show");

        // Paksa browser membaca layout supaya transition restart
        void el.offsetWidth;

        el.classList.add("show");
      }
    });
  }

  window.addEventListener("scroll", () => {
    const currentY = window.scrollY;

    if(currentY > lastScrollY){
      if(direction !== "down"){
        direction = "down";
        clearTimeout(directionTimer);
        directionTimer = setTimeout(animateVisibleElements, 30);
      }
    }else if(currentY < lastScrollY){
      if(direction !== "up"){
        direction = "up";
        clearTimeout(directionTimer);
        directionTimer = setTimeout(animateVisibleElements, 30);
      }
    }

    lastScrollY = currentY;
  }, {passive:true});

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {

      if(entry.isIntersecting){

        // Tentukan arah masuk elemen
        const rect = entry.boundingClientRect;

        entry.target.classList.remove("show");
        void entry.target.offsetWidth;

        // Saat scroll turun: elemen datang dari bawah.
        // Saat scroll naik: elemen datang dari atas.
        if(direction === "up" || rect.top < 0){
          entry.target.classList.add("show");
        }else{
          entry.target.classList.add("show");
        }

      }else{
        // Keluar layar -> reset.
        // Nanti saat masuk lagi animasi akan dimainkan.
        entry.target.classList.remove("show");
      }

    });
  },{
    threshold:0.01,
    rootMargin:"-40px 0px -40px 0px"
  });

  // Elemen dinamis seperti kartu porsi/gizi ikut terdeteksi
  function observeTargets(){
    getTargets().forEach(el => observer.observe(el));
  }

  observeTargets();

  // Karena data.js dirender sebelum fungsi ini dipanggil,
  // cek sekali lagi setelah DOM selesai.
  setTimeout(observeTargets, 100);
}

render();
startScrollAnimations();
</script>

</body>
</html>
