<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Hari Ini</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f0e5;color:#15243b;font-family:Georgia,serif}
.container{max-width:900px;margin:auto;padding:14px}
.hero,.section{background:#fff;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0001}
.hero{text-align:center;background:linear-gradient(135deg,#fffaf0,#f9dfad)}
.brand{font-size:20px;font-weight:bold}
.title{font-size:62px;font-weight:900;line-height:1}
.subtitle{font-size:42px;color:#a34c1d;font-style:italic;margin:10px 0}
.date{font-size:23px;font-weight:bold}
.badge{display:inline-block;background:#15243b;color:#fff;border-radius:99px;padding:12px 18px;margin-top:12px}
.section h2{margin:0 0 14px;font-size:28px}
.menu-list{margin:0;padding-left:25px;line-height:1.8;font-size:19px}
.photo{width:100%;max-height:560px;object-fit:contain;border-radius:15px;background:#eee}
.portions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{border:2px solid #f2b544;border-radius:18px;padding:17px;background:#fffaf0}
.card h3{margin:0 0 8px;font-size:20px}
.price{font-weight:800;margin-bottom:12px}
.items{margin:0;padding-left:19px;line-height:1.65}
.nutrition{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.nutri{background:#f59e0b;color:white;border-radius:15px;padding:13px 8px;text-align:center;font-weight:800}
.nutri small{display:block;font-weight:600;font-size:11px;margin-bottom:4px}
.expiry{background:#fff4cf;border-left:6px solid #f59e0b;border-radius:14px;padding:15px;line-height:1.6;font-size:18px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type="date"]{padding:11px 13px;border:1px solid #ccc;border-radius:10px;font-size:15px}
button{border:0;border-radius:10px;padding:11px 15px;background:#172033;color:white;font-weight:700;cursor:pointer}
.empty{text-align:center;padding:20px 10px;color:#667085}
footer{text-align:center;padding:25px 10px;color:#667085;font-size:13px}
@media(max-width:650px){
 .portions{grid-template-columns:1fr}
 .nutrition{grid-template-columns:repeat(2,1fr)}
 .container{padding:12px}
 .hero{padding:22px 14px}
 .title{font-size:50px}
 .subtitle{font-size:34px}
}
</style>
</head>
<body>
<main class="container">

<section class="hero">
  <div class="brand" id="brand"></div>
  <div class="title">MENU</div>
  <div class="subtitle">Special Today's</div>
  <div class="date" id="dateText"></div>
  <div class="badge">MENU HARI INI • INFORMASI GIZI</div>
</section>

<section class="section" id="photoSection" style="display:none">
  <h2>📷 Foto Menu Hari Ini</h2>
  <img id="photo" class="photo" alt="Foto menu hari ini">
</section>

<section class="section">
  <h2>🍽️ Menu</h2>
  <ul class="menu-list" id="menuList"></ul>
</section>

<section class="section" id="portionSection" style="display:none">
  <h2>🥗 Pilihan Porsi</h2>
  <div class="portions" id="portionCards"></div>
</section>

<section class="section">
  <h2>❤️ Informasi Gizi</h2>
  <div class="portions" id="nutritionCards"></div>
</section>

<section class="section">
  <h2>⏰ Batas Konsumsi</h2>
  <div class="expiry" id="expiry"></div>
</section>

<section class="section">
  <h2>🔎 Lihat Tanggal Lain</h2>
  <div class="controls">
    <input type="date" id="datePicker">
    <button onclick="loadSelectedDate()">Tampilkan</button>
    <button onclick="loadToday()">Hari Ini</button>
  </div>
</section>

<footer>
  Informasi menu dan gizi • Silakan sesuaikan data dengan data resmi instansi.
</footer>

</main>

<script src="data.js"></script>
<script>
const monthNames=[
 "Januari","Februari","Maret","April","Mei","Juni",
 "Juli","Agustus","September","Oktober","November","Desember"
];

function formatDate(dateString){
 const d=new Date(dateString+"T00:00:00");
 if(isNaN(d)) return dateString;
 return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
}

function todayLocal(){
 const d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function esc(value){
 return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function render(dateString){
 const data=menuData?.[dateString];

 document.getElementById("datePicker").value=dateString;
 document.getElementById("brand").textContent=siteInfo?.instansi || "Menu Harian";
 document.getElementById("dateText").textContent=formatDate(dateString);

 const menuList=document.getElementById("menuList");
 const portionSection=document.getElementById("portionSection");
 const portionCards=document.getElementById("portionCards");
 const nutritionCards=document.getElementById("nutritionCards");
 const expiry=document.getElementById("expiry");
 const photoSection=document.getElementById("photoSection");
 const photo=document.getElementById("photo");

 if(!data){
   photoSection.style.display="none";
   portionSection.style.display="none";
   menuList.innerHTML='<li>Menu belum tersedia untuk tanggal ini.</li>';
   nutritionCards.innerHTML='<div class="empty">Belum ada informasi gizi.</div>';
   expiry.innerHTML='<strong>Menu belum tersedia.</strong><br>Belum ada data untuk '+esc(formatDate(dateString))+'.';
   return;
 }

 // Foto bersifat opsional
 if(data.photo){
   photo.src=data.photo;
   photoSection.style.display="block";
 }else{
   photo.removeAttribute("src");
   photoSection.style.display="none";
 }

 // Menu
 const menus=Array.isArray(data.menu)?data.menu:[];
 menuList.innerHTML=menus.length
   ? menus.map(item=>`<li>${esc(item)}</li>`).join("")
   : '<li>Belum ada menu.</li>';

 // Pilihan porsi bersifat opsional
 const portions=Array.isArray(data.portions)?data.portions:[];
 if(portions.length){
   portionSection.style.display="block";
   portionCards.innerHTML=portions.map(p=>`
     <div class="card">
       <h3>${esc(p.nama)}</h3>
       ${p.harga?`<div class="price">${esc(p.harga)}</div>`:""}
       ${Array.isArray(p.items)?`<ul class="items">${p.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}
     </div>
   `).join("");
 }else{
   portionSection.style.display="none";
   portionCards.innerHTML="";
 }

 // Informasi gizi
 const nutrition=Array.isArray(data.nutrition)?data.nutrition:[];
 if(nutrition.length){
   nutritionCards.innerHTML=nutrition.map(n=>`
     <div class="card">
       <h3>${esc(n.nama)}</h3>
       ${n.total_porsi!==undefined && n.total_porsi!=="" ? `<p><strong>Total porsi:</strong> ${esc(n.total_porsi)}</p>` : ""}
       <div class="nutrition">
         <div class="nutri"><small>ENERGI</small>${esc(n.energi)}</div>
         <div class="nutri"><small>PROTEIN</small>${esc(n.protein)}</div>
         <div class="nutri"><small>LEMAK</small>${esc(n.lemak)}</div>
         <div class="nutri"><small>KARBO</small>${esc(n.karbohidrat)}</div>
         <div class="nutri"><small>SERAT</small>${esc(n.serat)}</div>
       </div>
     </div>
   `).join("");
 }else{
   nutritionCards.innerHTML='<div class="empty">Belum ada informasi gizi.</div>';
 }

 expiry.innerHTML=`<strong>Batas konsumsi:</strong> ${esc(data.batas_konsumsi || "Belum ada keterangan.")}`;
}

function loadToday(){
 render(todayLocal());
}

function loadSelectedDate(){
 const value=document.getElementById("datePicker").value;
 if(value) render(value);
}

// Jika hari ini belum ada datanya, otomatis buka tanggal data terbaru.
const dates=Object.keys(menuData||{}).sort();
const initialDate=menuData?.[todayLocal()]
 ? todayLocal()
 : (dates.length ? dates[dates.length-1] : todayLocal());

render(initialDate);
</script>
</body>
</html>
